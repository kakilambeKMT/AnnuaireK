<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mon compte · L’annuaire K</title><link rel="stylesheet" href="k.css"></head><body><main style="max-width:540px;margin:5vh auto;padding:24px"><a class="logo" href="/">l’annuaire K</a><section class="surface space-top"><div class="eyebrow">VOTRE ESPACE PERSONNEL</div><h1 id="auth-title" style="font-size:30px;margin-top:20px">Bienvenue dans le réseau.</h1><p class="muted" id="auth-intro">Connectez-vous ou créez votre compte pour inscrire et gérer vos activités.</p><div class="chips" id="auth-tabs"><button class="chip active" data-mode="login">Connexion</button><button class="chip" data-mode="signup">Créer un compte</button></div><form id="auth-form"><label class="form-field" id="email-label">E-mail<input id="email" type="email" autocomplete="email" maxlength="160" required></label><label class="form-field" id="password-label">Mot de passe<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><p class="form-hint">Pour un nouveau compte, utilisez au moins 12 caractères. Votre mot de passe est traité par Netlify Identity.</p><button class="button" id="auth-submit">Se connecter</button></form><p id="auth-message" class="notice" role="status" hidden></p><p><button class="text-button" id="forgot">Mot de passe oublié ?</button></p><a class="text-button" href="/">← Retour à l’annuaire</a></section></main><script type="module" src="auth.js"></script></body></html>
